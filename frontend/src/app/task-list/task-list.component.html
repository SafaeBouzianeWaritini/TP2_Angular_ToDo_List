<div class="container mt-4" style="max-width: 800px;">
  <h2>Gestion des tâches</h2>

  <!-- Formulaire d'ajout (Angular Forms : template-driven) -->
  <form (ngSubmit)="addTask()" class="mb-3">
    <input type="text" class="form-control mb-2" name="title"
           placeholder="Titre de la tâche" [(ngModel)]="newTitle" required>
    <textarea class="form-control mb-2" name="description"
              placeholder="Description de la tâche" [(ngModel)]="newDescription"></textarea>
    <button type="submit" class="btn btn-primary btn-sm">Ajouter une tâche</button>
  </form>

  <!-- Liste des tâches -->
  <ul class="list-group">
    <li *ngFor="let task of tasks"
        class="list-group-item d-flex justify-content-between align-items-center">

      <!-- Mode affichage -->
      <ng-container *ngIf="editingId !== task._id">
        <div>
          <strong [style.text-decoration]="task.completed ? 'line-through' : 'none'">
            {{ task.title }}
          </strong>
          <div class="small">{{ task.description }}</div>
        </div>
        <div>
          <button class="btn btn-success btn-sm me-1" (click)="toggleCompleted(task)">
            {{ task.completed ? 'Reprendre' : 'Terminer' }}
          </button>
          <button class="btn btn-warning btn-sm me-1" (click)="startEdit(task)">Modifier</button>
          <button class="btn btn-danger btn-sm" (click)="deleteTask(task)">Supprimer</button>
        </div>
      </ng-container>

      <!-- Mode édition -->
      <ng-container *ngIf="editingId === task._id">
        <div class="flex-grow-1 me-2">
          <input type="text" class="form-control mb-1" [(ngModel)]="editTitle" name="editTitle">
          <input type="text" class="form-control" [(ngModel)]="editDescription" name="editDesc">
        </div>
        <div>
          <button class="btn btn-primary btn-sm me-1" (click)="saveEdit(task)">Enregistrer</button>
          <button class="btn btn-secondary btn-sm" (click)="cancelEdit()">Annuler</button>
        </div>
      </ng-container>
    </li>
  </ul>
</div>
